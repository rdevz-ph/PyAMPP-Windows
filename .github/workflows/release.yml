name: Build and Release PyAMPP

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "screenshots/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.9 - leave blank to auto-detect from tag.txt)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine Tag
        id: determine_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          elif [ -f "tag.txt" ]; then
            TAG=$(tr -d '\r\n' < tag.txt)
          else
            TAG=$(python -c "from core.config import VERSION; print(VERSION)")
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Build Standalone Executable
        run: |
          python build.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PyAMPP-${{ env.TAG }}
          path: dist/*.exe

      - name: Publish Executable to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ env.TAG }}"
          EXE_PATH=$(ls dist/*.exe | head -n 1)
          
          # Clean up existing release and tag for the same version if present
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$TAG" 2>/dev/null || true
          
          # Create fresh release and upload executable
          if [ -f "RELEASE.md" ]; then
            gh release create "$TAG" "$EXE_PATH" \
              --title "PyAMPP $TAG" \
              --notes-file RELEASE.md
          else
            gh release create "$TAG" "$EXE_PATH" \
              --title "PyAMPP $TAG" \
              --generate-notes
          fi
